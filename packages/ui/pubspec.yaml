name: pop_ui
description: PoP 2.0 proposal demonstration
version: 1.0.0+1
publish_to: none
environment:
  sdk: ">=3.13.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  pop_domain:
    path: ../domain
  intl: 0.20.3
  flutter_riverpod: 3.4.3
  go_router: 18.1.3
  flutter_localizations:
    sdk: flutter
  flutter_tts: 4.2.5
  web: 1.1.2
  flutter_appauth: 13.0.0
  http: 1.6.0
  crypto: 3.0.8
  speech_to_text: 7.5.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/fonts/OFL.txt
    - assets/licenses/VengeanceUI-MIT.txt
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSans-SemiBold.ttf
          weight: 600
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansDevanagari-SemiBold.ttf
          weight: 600
